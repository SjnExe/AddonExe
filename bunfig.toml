# Top-level Runtime Settings
telemetry = false
logLevel = "warn"

[install]
minimumReleaseAge = 0
peer = true
linker = "isolated"

[run]
bun = true
shell = "bun"
noOrphans = true

[test]
preload = ["./src/core/__tests__/__mocks__/bunSetup.ts"]
smol = false
onlyFailures = true
isolate = false
randomize = true

[fmt]
tabWidth = 4
useTabs = false
semi = true
singleQuote = true
quoteProps = "preserve"
trailingComma = "none"
printWidth = 200
endOfLine = "lf"
sortImports = true
sortPackageJson = true
jsdoc = true

[[fmt.overrides]]
files = ["packs/**/*.json"]
options = { printWidth = 100000, tabWidth = 2 }
