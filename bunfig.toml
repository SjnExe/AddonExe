# Top-level Runtime Settings
telemetry = false
logLevel = "warn"

[install]
minimumReleaseAge = 0
peer = true
linker = "isolated"

[run]
bun = true
shell = "bun"
noOrphans = true

[test]
preload = ["./src/core/__tests__/__mocks__/bunSetup.ts"]
smol = false
onlyFailures = true
isolate = false
randomize = true
timeout = 5000

[fmt]
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
quoteProps = "as-needed"
trailingComma = "all"
printWidth = 120
endOfLine = "lf"
sortImports = true
sortPackageJson = true
jsdoc = true

[[fmt.overrides]]
files = ["packs/**/*.json"]
options = { printWidth = 120, tabWidth = 2 }
