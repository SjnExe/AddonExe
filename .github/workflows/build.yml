name: Build

on:
    push:
        tags:
            - 'v*'
        branches:
            - main
    workflow_dispatch:
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Cache Bun Dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Cache Oxlint & TS Build Artifacts
              uses: actions/cache@v6
              with:
                  path: |
                      *.tsbuildinfo
                  key: ${{ runner.os }}-oxlint-${{ hashFiles('**/bun.lock', 'oxlint.json', 'scripts/lint/minecraft-rules.js', 'tsconfig.json') }}
                  restore-keys: |
                      ${{ runner.os }}-oxlint-

            - run: bun install --frozen-lockfile
            - run: bun lint

    format:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Cache Bun Dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - run: bun install --frozen-lockfile
            - run: bun format:check

    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Cache Bun Dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Cache TS Build Artifacts
              uses: actions/cache@v6
              with:
                  path: '*.tsbuildinfo'
                  key: ${{ runner.os }}-tsc-${{ hashFiles('**/bun.lock', 'tsconfig.json') }}
                  restore-keys: |
                      ${{ runner.os }}-tsc-

            - run: bun install --frozen-lockfile
            - run: bun check-types

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Cache Bun Dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - run: bun install --frozen-lockfile
            - run: bun test --isolate --parallel

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Cache Bun Dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Determine Build Type
              id: build_type
              run: |
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                      echo "type=stable" >> $GITHUB_OUTPUT
                  else
                      echo "type=nightly" >> $GITHUB_OUTPUT
                  fi

            - name: Build TypeScript (Nightly)
              if: steps.build_type.outputs.type == 'nightly'
              run: |
                  bun run build:nightly -- -b ${{ github.run_number }}
              env:
                  IS_BETA_RELEASE: 'true'

            - name: Build TypeScript (Stable)
              if: steps.build_type.outputs.type == 'stable'
              run: |
                  TAG_VER="${{ github.ref_name }}"
                  CLEAN_TAG="${TAG_VER#v}"
                  bun run build:release -- -v "$CLEAN_TAG"

            - name: Load Build Meta into GITHUB_ENV
              run: |
                  cat build_meta.env >> $GITHUB_ENV

            - name: Verify Staged Packs
              run: |
                  if [ ! -d "packs/behavior/scripts" ]; then
                    echo "Error: Scripts directory missing from behavior pack."
                    exit 1
                  fi

            - name: Upload Raw Build Directory
              uses: actions/upload-artifact@v7
              with:
                  name: build-dir
                  path: packs/
                  retention-days: 1

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-archives
                  path: |
                      AddonExe.${{ env.PREFIX }}.${{ env.ARCHIVE_VERSION }}.mcaddon
                      AddonExe_BP.${{ env.PREFIX }}.${{ env.ARCHIVE_VERSION }}.mcpack
                      AddonExe_RP.${{ env.PREFIX }}.${{ env.ARCHIVE_VERSION }}.mcpack
                  retention-days: 7
                  compression-level: 0

            - name: Upload Debug Symbols (Nightly only)
              if: steps.build_type.outputs.type == 'nightly'
              uses: actions/upload-artifact@v7
              with:
                  name: debug-symbols-nightly
                  path: packs/**/*.map
                  retention-days: 7

            - name: Upload build meta
              uses: actions/upload-artifact@v7
              with:
                  name: build-meta
                  path: build_meta.env
                  retention-days: 7

            - name: Validate build
              run: bun run validate:ci

    release:
        needs: [build, lint, format, typecheck, test]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Download Build Meta
              uses: actions/download-artifact@v8
              with:
                  name: build-meta

            - name: Download Release Archives
              uses: actions/download-artifact@v8
              with:
                  name: release-archives

            - name: Load Build Meta
              run: |
                  cat build_meta.env >> $GITHUB_ENV

            - name: Clean Old Nightly Assets
              if: env.BUILD_TYPE == 'nightly'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release delete nightly --cleanup-tag --yes || true

            - name: Publish Nightly Release
              if: env.BUILD_TYPE == 'nightly'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cat <<EOF > release_notes.md
                  **Latest Nightly Build**
                  Version: \`${{ env.VERSION_STRING }}\`
                  Commit: \`${{ github.sha }}\`
                  Date: \`${{ env.BUILD_DATE }}\`

                  *This is an automated development build. It may contain bugs.*
                  EOF

                  gh release create nightly \
                      --title "Nightly Build (Latest Dev)" \
                      --prerelease \
                      --notes-file release_notes.md \
                      AddonExe.Nightly.${{ env.ARCHIVE_VERSION }}.mcaddon \
                      AddonExe_BP.Nightly.${{ env.ARCHIVE_VERSION }}.mcpack \
                      AddonExe_RP.Nightly.${{ env.ARCHIVE_VERSION }}.mcpack

            - name: Publish Stable Release
              if: env.BUILD_TYPE == 'stable'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create ${{ env.ARCHIVE_VERSION }} \
                      --generate-notes \
                      AddonExe.Release.${{ env.ARCHIVE_VERSION }}.mcaddon \
                      AddonExe_BP.Release.${{ env.ARCHIVE_VERSION }}.mcpack \
                      AddonExe_RP.Release.${{ env.ARCHIVE_VERSION }}.mcpack
