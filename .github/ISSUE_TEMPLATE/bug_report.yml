name: '🐛 Bug Report'
description: File a bug report for AddonExe
title: '[BUG]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        > **Note:** If you discovered a security vulnerability, please report it privately via [GitHub Security Advisories](https://github.com/SjnExe/AddonExe/security/advisories/new).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing [GitHub Issues](https://github.com/SjnExe/AddonExe/issues) to ensure this bug has not been reported.
          required: true
        - label: I confirm I am running the latest stable release of Minecraft Bedrock Edition and the latest release or a canary build of AddonExe.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description & Steps to Reproduce
      description: Explain what happened unexpectedly and how to reproduce it.
      placeholder: |
        1. Run command '/panel' or '/...'
        2. Click on '...'
        3. Observed error or unexpected behavior...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: What should have happened...
    validations:
      required: true

  - type: input
    id: addon_version
    attributes:
      label: AddonExe Version
      description: Version reported by `/version` (or CurseForge release tag).
      placeholder: e.g. v0.8.0
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment & Platform
      description: Where is the world hosted and on what device?
      options:
        - 'Singleplayer / Local World (Windows PC)'
        - 'Singleplayer / Local World (Mobile / Console)'
        - 'Minecraft Realm'
        - 'Bedrock Dedicated Server (BDS)'
        - 'Other'
    validations:
      required: true

  - type: textarea
    id: content_log
    attributes:
      label: Content Log / Screenshots / Additional Context (Optional)
      description: Paste any Minecraft Content Log errors (`Settings -> Creator -> Enable Content Log GUI`) or drag-and-drop screenshots.
      placeholder: Paste any [Scripting][error] lines, attach screenshots, or add context here...
