name: '✨ Feature Request'
description: Suggest an idea or enhancement for AddonExe
title: '[FEAT]: '
labels: ['enhancement', 'needs-discussion']
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing [GitHub Issues](https://github.com/SjnExe/AddonExe/issues) to ensure this feature has not already been requested.
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which part of AddonExe does this feature relate to?
      options:
        - 'Economy, Shop & Auction House'
        - 'Moderation, Security & Anti-Cheat'
        - 'Teleportation, Spawn & World Protection'
        - 'Custom Dark-Mode UI & Form Layouts'
        - 'Ranks, Permissions & Chat Formatting'
        - 'Sidebar HUD & Visual Displays'
        - 'Social Systems (Friends, Teams, Mail)'
        - 'Mini-Games Hub'
        - 'Survival Quality of Life (VeinMiner, AutoReplant, etc.)'
        - 'Server Administration & BDS Tools'
        - 'Other'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature Description & Proposal
      description: Describe what you want added and how players or administrators would interact with it.
      placeholder: Explain the feature, gameplay behavior, or configuration settings...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context, Mockups, or Alternatives (Optional)
      description: Include any screenshots, mockups, or alternative solutions considered.
