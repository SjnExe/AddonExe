# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
tone_instructions: >
  Bedrock TS and Bun performance engineer. Be direct, concise, and technical; avoid pleasantries, corporate fluff, and filler. Prioritize 50ms tick-budget efficiency, zero-lag execution, memory safety, and native Bun optimizations.

reviews:
  profile: 'assertive'
  poem: false
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  request_changes_workflow: false

  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - 'main'

  pre_merge_checks:
    title:
      mode: 'warning'
    description:
      mode: 'warning'
    docstrings:
      mode: 'off'

  path_filters:
    - '!bun.lock'
    - '!out/**'
    - '!packs/behavior/scripts/**'
    - '!packs/resource/textures/**'
    - '!*.mcaddon'
    - '!*.mcpack'

  path_instructions:
    - path: 'src/**/*.ts'
      instructions: |
        - Performance & Tick Budget: Flag any expensive operations or object allocations inside runInterval, system.runInterval, or per-tick loops.
        - Native C++ Boundary Overhead: Minimize synchronous native engine calls (e.g., dimension.getBlock); recommend caching or batching where possible.
        - Algorithmic Complexity: Enforce O(1) Map/Set lookups over repeated O(N) array scans in hot paths.
        - Bedrock Entity Safety: Ensure player.isValid and entity.isValid guards are present after any async delays or tick transitions.
        - Broken Block Handling: In PlayerBreakBlockAfterEvent, event.block.typeId evaluates to 'minecraft:air'; handlers must inspect event.brokenBlockPermutation.
        - Constants & Types: Verify vanilla IDs use @minecraft/vanilla-data constants instead of raw strings.
        - Style & Naming: Enforce camelCase for variables/functions and PascalCase for types; reject snake_case or UPPER_SNAKE_CASE.
        - Feature Defaults: Player-facing gameplay features must default to 'enabled: false'.

    - path: 'scripts/**/*.ts'
      instructions: |
        - Native Bun Runtime: Use native Bun APIs (Bun.spawnSync, Bun.file, Bun.Glob). Never suggest node:child_process or CommonJS require().
        - Named Imports: Enforce named ESM imports from node:path (e.g., import { join } from 'node:path').

    - path: 'packs/**'
      instructions: |
        - Build artifacts under packs/behavior/scripts/ must never be edited manually.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'AGENTS.md'
      - '.github/CONTRIBUTING.md'
